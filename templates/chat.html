<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Medical Chatbot</title>
	<!-- Google Fonts: Inter -->
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<!-- Bootstrap 4 & FontAwesome -->
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
	<!-- Custom CSS -->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
</head>

<body>
	<div class="container-fluid h-100">
		<div class="row justify-content-center align-items-center h-100">		
			<div class="col-md-9 col-lg-7 col-xl-5 chat">
				<div class="card chat-card">
					
					<!-- Chat Header -->
					<div class="card-header msg_head">
						<div class="d-flex align-items-center">
							<div class="img_cont">
								<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img" alt="Bot Avatar">
								<span class="online_icon"></span>
							</div>
							<div class="user_info">
								<span>Medical Assistant AI</span>
								<p><span class="status-dot"></span> Online &bull; Ask me anything</p>
							</div>
						</div>
					</div>

					<!-- Chat Messages Body -->
					<div id="messageFormeight" class="card-body msg_card_body">
						<!-- Initial Welcome Message -->
						<div class="d-flex justify-content-start mb-4 message-fade-in">
							<div class="img_cont_msg">
								<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg" alt="Bot">
							</div>
							<div class="msg_cotainer">
								Hello! I'm your Medical AI Assistant. How can I help you today?
								<span class="msg_time">Just now</span>
							</div>
						</div>
					</div>

					<!-- Chat Input Footer -->
					<div class="card-footer">
						<form id="messageArea" class="input-group">
							<input type="text" id="text" name="msg" placeholder="Describe your symptoms or ask a medical question..." autocomplete="off" class="form-control type_msg" required/>
							<div class="input-group-append">
								<button type="submit" id="send" class="input-group-text send_btn" title="Send message">
									<i class="fas fa-paper-plane"></i>
								</button>
							</div>
						</form>
					</div>

				</div>
			</div>
		</div>
	</div>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script>
		function scrollToBottom() {
			var chatBox = $("#messageFormeight");
			chatBox.stop().animate({ scrollTop: chatBox[0].scrollHeight }, 300);
		}

		function getFormattedTime() {
			const date = new Date();
			const hours = String(date.getHours()).padStart(2, '0');
			const minutes = String(date.getMinutes()).padStart(2, '0');
			return hours + ":" + minutes;
		}

		// Escape HTML to prevent XSS on user input
		function escapeHtml(text) {
			return $('<div>').text(text).html();
		}

		$(document).ready(function() {
			$("#messageArea").on("submit", function(event) {
				event.preventDefault();

				const str_time = getFormattedTime();
				var rawText = $("#text").val().trim();
				if (!rawText) return;

				// 1. Append User Message
				var userHtml = `
					<div class="d-flex justify-content-end mb-4 message-fade-in">
						<div class="msg_cotainer_send">
							${escapeHtml(rawText)}
							<span class="msg_time_send">${str_time}</span>
						</div>
						<div class="img_cont_msg">
							<img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg" alt="User">
						</div>
					</div>`;
				
				$("#text").val("").prop("disabled", true);
				$("#send").prop("disabled", true);
				$("#messageFormeight").append(userHtml);
				scrollToBottom();

				// 2. Append "Thinking..." Indicator
				var thinkingId = "thinking-" + Date.now();
				var thinkingHtml = `
					<div id="${thinkingId}" class="d-flex justify-content-start mb-4 message-fade-in">
						<div class="img_cont_msg">
							<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg" alt="Bot">
						</div>
						<div class="msg_cotainer thinking_bubble">
							<div class="thinking_wrapper">
								<span class="thinking_text">Thinking</span>
								<span class="typing_dots">
									<span>.</span><span>.</span><span>.</span>
								</span>
							</div>
						</div>
					</div>`;

				$("#messageFormeight").append(thinkingHtml);
				scrollToBottom();

				// 3. Send Request to Flask/Backend
				$.ajax({
					data: { msg: rawText },
					type: "POST",
					url: "/get",
				}).done(function(data) {
					$("#" + thinkingId).remove();
					const bot_time = getFormattedTime();
					var botHtml = `
						<div class="d-flex justify-content-start mb-4 message-fade-in">
							<div class="img_cont_msg">
								<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg" alt="Bot">
							</div>
							<div class="msg_cotainer">
								${data}
								<span class="msg_time">${bot_time}</span>
							</div>
						</div>`;
					$("#messageFormeight").append($.parseHTML(botHtml));
					scrollToBottom();
				}).fail(function() {
					$("#" + thinkingId).remove();
					const err_time = getFormattedTime();
					var errorHtml = `
						<div class="d-flex justify-content-start mb-4 message-fade-in">
							<div class="img_cont_msg">
								<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg" alt="Bot">
							</div>
							<div class="msg_cotainer error_bubble">
								Sorry, I encountered an error reaching the server. Please try again.
								<span class="msg_time">${err_time}</span>
							</div>
						</div>`;
					$("#messageFormeight").append(errorHtml);
					scrollToBottom();
				}).always(function() {
					$("#text").prop("disabled", false).focus();
					$("#send").prop("disabled", false);
				});
			});
		});
	</script>
</body>
</html>
